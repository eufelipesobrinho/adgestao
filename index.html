<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(function () {
        try {
          var theme =
            localStorage.getItem("contabs-theme") ||
            localStorage.getItem("ad-gestao-theme")
          var resolved =
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches)
          if (resolved) document.documentElement.classList.add("dark")
        } catch (e) {}
      })()
    </script>
    <!-- Logo light oficial Contabs — cache-bust v20260808 -->
